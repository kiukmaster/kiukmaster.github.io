name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Collect X news']
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      HUGO_VERSION: '0.168.0'
      HUGO_SHA256: fada83ad56bb27ed4cb7dd81590303bdac16140f944ac4e66fc248117e2d5594
    steps:
      - name: Check out the exact public repository commit
        run: &checkout_public_commit |
          set -euo pipefail
          git init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Restore collected news without running archive code
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin refs/heads/news-data > /dev/null; then
            git fetch --quiet --no-tags --depth=1 origin refs/heads/news-data
            git show FETCH_HEAD:news.json > data/news.json
            translation_entry="$(git ls-tree --name-only FETCH_HEAD -- news_translations.json)"
            if [ -n "$translation_entry" ]; then
              git show FETCH_HEAD:news_translations.json > data/news_translations.json
            else
              rm -f -- data/news_translations.json
            fi
          else
            result=$?
            if [ "$result" -ne 2 ]; then exit "$result"; fi
          fi
          python3 .github/scripts/collect-news.py --state data/news.json --migrate
          python3 .github/scripts/translate-news.py --state data/news.json \
            --cache data/news_translations.json --initialize-cache
          python3 .github/scripts/translate-news.py --state data/news.json \
            --cache data/news_translations.json --validate-only

      - name: Download and verify Hugo
        run: |
          set -euo pipefail
          hugo_dir="$RUNNER_TEMP/hugo-$HUGO_VERSION"
          hugo_archive="$RUNNER_TEMP/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 \
            --output "$hugo_archive" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          printf '%s  %s\n' "$HUGO_SHA256" "$hugo_archive" | sha256sum --check --strict
          mkdir -p "$hugo_dir"
          tar --extract --gzip --file "$hugo_archive" --directory "$hugo_dir" --no-same-owner hugo
          chmod 0755 "$hugo_dir/hugo"

      - name: Build the static site
        run: |
          "$RUNNER_TEMP/hugo-$HUGO_VERSION/hugo" build \
            --minify --printPathWarnings --panicOnWarning \
            --environment production --destination public

      - name: Fetch the pinned artifact upload tool
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          PAGES_ACTION: upload-artifact
          PAGES_ACTION_SHA: bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        run: &fetch_pages_action |
          set -euo pipefail
          action_dir="$GITHUB_WORKSPACE/.pages-tools/action"
          mkdir -p "$action_dir"
          git -C "$action_dir" init --quiet
          git -C "$action_dir" remote add origin "https://github.com/actions/$PAGES_ACTION.git"
          git -C "$action_dir" fetch --quiet --no-tags --depth=1 origin "$PAGES_ACTION_SHA"
          git -C "$action_dir" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$action_dir" rev-parse HEAD)" = "$PAGES_ACTION_SHA"

      - name: Package the Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          tar --create --file "$GITHUB_WORKSPACE/.pages-tools/artifact.tar" \
            --directory public --dereference --hard-dereference \
            --exclude=.git --exclude=.github .

      - name: Upload with patched Node 24.22.1
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker://node:24.22.1-bookworm-slim@sha256:2dd9a4f758e173b65fee15388f7706af6fb01ef50cf7a2c0538711d67a6981ae
        env:
          PAGES_ACTION_ENTRYPOINT: /github/workspace/.pages-tools/action/dist/upload/index.js
          INPUT_NAME: github-pages
          INPUT_PATH: /github/workspace/.pages-tools/artifact.tar
          INPUT_IF-NO-FILES-FOUND: error
          INPUT_RETENTION-DAYS: '1'
          INPUT_COMPRESSION-LEVEL: '0'
          INPUT_OVERWRITE: 'false'
          INPUT_INCLUDE-HIDDEN-FILES: 'true'
          INPUT_ARCHIVE: 'true'
        with:
          entrypoint: /usr/local/bin/node
          args: /github/workspace/.github/scripts/run-pages-action.cjs

  deploy:
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the exact public repository commit
        run: *checkout_public_commit

      - name: Fetch the pinned Pages deployment tool
        env:
          PAGES_ACTION: deploy-pages
          PAGES_ACTION_SHA: 368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        run: *fetch_pages_action

      - name: Deploy with patched Node 24.22.1
        id: deployment
        uses: docker://node:24.22.1-bookworm-slim@sha256:2dd9a4f758e173b65fee15388f7706af6fb01ef50cf7a2c0538711d67a6981ae
        env:
          PAGES_ACTION_ENTRYPOINT: /github/workspace/.pages-tools/action/dist/index.js
          INPUT_TOKEN: ${{ github.token }}
          INPUT_TIMEOUT: '600000'
          INPUT_ERROR_COUNT: '10'
          INPUT_REPORTING_INTERVAL: '5000'
          INPUT_ARTIFACT_NAME: github-pages
          INPUT_PREVIEW: 'false'
        with:
          entrypoint: /usr/local/bin/node
          args: /github/workspace/.github/scripts/run-pages-action.cjs
