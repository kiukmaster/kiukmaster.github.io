<article class="post-card" lang="ko">
  <div class="card-meta"><time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ (time.In "Asia/Seoul" .Date).Format "2006.01.02 15:04" }}</time>{{ range .GetTerms "categories" }}<a href="{{ .RelPermalink }}" class="category-label">{{ .Title }}</a>{{ end }}</div>
  <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  {{ with .Description }}<p class="card-excerpt">{{ . }}</p>{{ end }}
  {{ with .GetTerms "tags" }}<div class="tag-list">{{ range . }}<a class="tag" href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}</div>{{ end }}
</article>
