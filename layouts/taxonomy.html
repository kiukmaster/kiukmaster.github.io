{{ define "main" }}
{{ $key := .Data.Plural }}
<div class="page-heading"><h1 data-i18n="{{ $key }}">{{ partial "t.html" $key }}</h1></div>
<ul class="taxonomy-list">{{ range .Pages.ByTitle }}<li><a href="{{ .RelPermalink }}">{{ .Title }} <span class="count">{{ len .RegularPages }}</span></a></li>{{ end }}</ul>
{{ end }}
