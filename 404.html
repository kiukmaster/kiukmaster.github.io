<!DOCTYPE html><html lang="ko" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>페이지를 찾을 수 없습니다.</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#131316;color:#e4e1e6;font:15px/1.8 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:580px;width:100%;padding:60px 28px;text-align:center;background:#1b1b1e;border:1px solid #333138;border-radius:12px}small{font-size:12px;letter-spacing:.2em;color:#d3c1ff}h1{font-size:27px;font-weight:550;line-height:1.5;margin:15px 0}p{font-size:13px;color:#b5afbc;margin-bottom:28px}a{display:inline-block;text-decoration:none;background:#d3c1ff;color:#131316;padding:10px 20px;border-radius:7px;font-size:13px}a:focus-visible{outline:2px solid #d3c1ff;outline-offset:5px}</style></head><body><main><small>404 / NOT FOUND</small><h1>페이지를 찾을 수 없습니다.</h1><p>주소가 변경되었거나 존재하지 않는 페이지입니다.</p><a id="home" href="/">홈으로 돌아가기</a></main><script>
// 프로젝트 저장소의 하위 경로에서 404가 발생해도 가장 가까운 블로그 루트를 찾습니다.
(async()=>{let path=location.pathname.split('/').filter(Boolean);if(!location.pathname.endsWith('/'))path.pop();for(let count=0;count<20;count++){const base='/'+(path.length?path.join('/')+'/':'');try{const r=await fetch(base+'data/posts.json',{cache:'no-store'});if(r.ok){const d=await r.json();if(d.version===1&&Array.isArray(d.posts)){document.getElementById('home').href=base+'index.html';return;}}}catch{}if(!path.length)break;path.pop();}})();
</script></body></html>
